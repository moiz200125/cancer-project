name: Train and Promote Model
on: [push] # Triggers when code is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install mlflow scikit-learn pandas
    - name: Run MLOps Pipeline
      run: python mlops_pipeline.py
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_SERVER_URL }}
